schema_version = 1

[[feature]]
id = "model-runtime"
classification = "stable"
statement = "ModelRuntime owns provider-neutral request, response, event, tool, usage, and error contracts."
source = ["src/praval/model_runtime.py", "src/praval/models/__init__.py"]
evidence = ["tests/test_model_runtime_contracts.py"]
documentation = ["docs/sphinx/guide/model-runtime.md"]
notes = ["Provider and model profiles still constrain individual capabilities."]

