services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: praval_paper
      POSTGRES_USER: praval_paper
      POSTGRES_PASSWORD: praval-paper-validation
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praval_paper -d praval_paper"]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7.4.1-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    ports:
      - "55672:5672"
      - "55673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "56333:6333"
    tmpfs:
      - /qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data
    environment:
      MINIO_ROOT_USER: pravalminio
      MINIO_ROOT_PASSWORD: praval-minio-validation
    ports:
      - "59000:9000"
    tmpfs:
      - /data

  otel:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "54318:4318"
      - "51333:13133"
