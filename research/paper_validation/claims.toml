[[claim]]
id = "two-plane-architecture"
statement = "Praval separates agent coordination from provider-neutral model execution."
category = "architectural"
scope = "Praval 0.8.1 public Agent, Reef, Spore, ModelRuntime, and provider adapter boundaries."
paper_sections = ["Abstract", "System architecture", "Contributions"]
book_sections = ["Praval through 0.7.22", "The 0.8.1 two-plane architecture"]
status = "proposed"
implementation_evidence = ["src/praval/core/reef.py", "src/praval/model_runtime.py", "src/praval/providers/registry.py"]
citations = ["hewitt1973actor", "eugster2003publish_subscribe"]
experiments = ["runtime-contracts", "spore-v2-compatibility"]
acceptance_rule = "Runtime and Spore experiments preserve their separate contracts without introducing a second agent-to-agent layer."
permitted_wording = "Praval 0.8.1 separates its coordination plane from its model execution plane."
limitations = ["The separation is an implementation boundary, not a formal proof of architectural independence."]

[[claim]]
id = "initial-agent-coordination-foundation"
statement = "Praval 0.1.0 and 0.2.0 established direct agents, decorated agents, Reef, Spores, and message-driven specialist coordination."
category = "architectural"
scope = "Source states recorded for Praval 0.1.0 and 0.2.0 before the first retained Git tag."
paper_sections = ["Origins and development", "Results RQ1"]
book_sections = ["Praval before 0.7.22", "Agent, Reef, and Spore"]
status = "validated_with_scope"
implementation_evidence = ["research/paper_validation/history.toml", "src/praval/core/agent.py", "src/praval/core/reef.py", "src/praval/decorators.py"]
citations = ["praval_source_history"]
experiments = []
acceptance_rule = "The historical prose distinguishes source-version states from tagged releases and does not repeat unsupported contemporary marketing claims."
permitted_wording = "Praval began with a direct Agent abstraction, then made decorated agents, Reef, and Spores its main coordination model in the 0.2.0 source state."
limitations = ["The early version records establish implementation history, not performance, emergence, or production-readiness claims.", "Versions 0.1.0 and 0.2.0 do not have matching retained Git tags."]

[[claim]]
id = "intellectual-origins"
statement = "Praval's coordination design was informed by the author's earlier work on dynamical systems and population-based optimization, later experience with agent frameworks, and concepts from swarm intelligence, stigmergy, and coral reef systems."
category = "architectural"
scope = "Intellectual provenance for the specialist Agent, Reef, and Spore design, stated separately from claims about implemented semantics or measured behavior."
paper_sections = ["Introduction", "Intellectual origins and development", "Related work", "Results RQ1", "Conclusion"]
book_sections = ["Why specialist agents", "Agent, Reef, and Spore"]
status = "descriptive_only"
implementation_evidence = ["docs/plans/2026-07-30-praval-intellectual-origins-design.md", "docs/claude-code-prompt.md", "src/praval/core/reef.py", "src/praval/decorators.py"]
citations = ["holland1992_adaptation", "kirkpatrick1983_simulated_annealing", "kennedy_eberhart1995_pso", "bonabeau1999_swarm_intelligence", "grasse1959stigmergy", "hatcher1997_coral_systems", "sampathkumar2010_wing_optimization"]
experiments = []
acceptance_rule = "The paper connects the influences to concrete Praval interfaces, distinguishes the algorithms from one another, and does not claim that Praval is a biological simulation, an optimization algorithm, or a formal stigmergic system."
permitted_wording = "Praval's message-driven coordination model drew on the author's work with dynamical systems and population-based optimization, practical agent-framework experience, and ideas from swarm intelligence, stigmergy, and coral reef systems."
limitations = ["The account records design provenance, not experimental evidence that Praval reproduces biological emergence.", "Simulated annealing is a single-trajectory stochastic search method, not a swarm method.", "Reef uses explicit software messages rather than persistent environmental traces."]

